name: Test

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'functions/orbit-ics/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/orbit-ics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/orbit-ics/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
